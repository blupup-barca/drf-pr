name: Django CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Clean pip cache
        run: |
          pip cache purge
          rm -rf ~/.cache/pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Flake8
        run: |
          echo "Используемый конфиг:"
          cat .flake8
          flake8 . --config=.flake8 || echo "Предупреждения есть, но сборка не падает"

      - name: Show REAL errors (optional)
        if: always()
        run: flake8 . --show-source --statistics


  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 123456
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: |
          poetry lock
          poetry install --no-root
      - name: Makemigrations
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          NAME: my_project
          USER: postgres
          PASSWORD: 4800
          HOST: localhost
          PORT: 5432
        run: poetry run python manage.py makemigrations
      - name: Run tests
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          NAME: my_project
          USER: postgres
          PASSWORD: 4800
          HOST: localhost
          PORT: 5432
        run: poetry run python manage.py test


  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo ${{ secrets.DOCKER_HUB_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }} .

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}


  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy to Server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            # Деплой контейнера
            sudo docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}
            sudo docker stop myapp || true
            sudo docker rm myapp || true
            sudo docker run -d \
              --name myapp \
              -p 80:8080 \
              -e HOST=localhost \
              ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}

            # Настройка systemd (если сервис ещё не существует)
            if ! systemctl is-active --quiet myapp.service; then
              echo "[Unit]
              Description=My App Container
              After=docker.service

              [Service]
              ExecStart=/usr/bin/docker start -a myapp
              ExecStop=/usr/bin/docker stop myapp
              Restart=always
              RestartSec=5s

              [Install]
              WantedBy=multi-user.target" | sudo tee /etc/systemd/system/myapp.service
              sudo systemctl daemon-reload
              sudo systemctl enable myapp.service
            fi

            # Перезапуск сервиса
            sudo systemctl restart myapp.service
          EOF