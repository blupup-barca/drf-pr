name: Django CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Set up Pythonytho
      uses: actions/setup-python@v2
      with:
        python-version: 3.12
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        pip install -r requirements.txt
    - name: Run Linter
      run: flake8 .


  test:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create static dir
        run: mkdir -p static
      - name: Set up SECRET_KEY
        run: echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> $GITHUB_ENV
      - name: Run tests
        env:
            SECRET_KEY: ${{ secrets.SECRET_KEY }}
            DATABASE_URL: "sqlite:///test_db.sqlite3"
        run: |
            python manage.py test --noinput


  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy to Server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            # Деплой контейнера
            sudo docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}
            sudo docker stop myapp || true
            sudo docker rm myapp || true
            sudo docker run -d \
              --name myapp \
              -p 80:8080 \
              -e HOST=localhost \
              ${{ secrets.DOCKER_HUB_USERNAME }}/myapp:${{ github.sha }}

            # Настройка systemd (если сервис ещё не существует)
            if ! systemctl is-active --quiet myapp.service; then
              echo "[Unit]
              Description=My App Container
              After=docker.service

              [Service]
              ExecStart=/usr/bin/docker start -a myapp
              ExecStop=/usr/bin/docker stop myapp
              Restart=always
              RestartSec=5s

              [Install]
              WantedBy=multi-user.target" | sudo tee /etc/systemd/system/myapp.service
              sudo systemctl daemon-reload
              sudo systemctl enable myapp.service
            fi

            # Перезапуск сервиса
            sudo systemctl restart myapp.service
          EOF